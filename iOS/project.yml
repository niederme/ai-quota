# iOS targets included by the repository-root project.yml.
# Generate the shared project from the repository root with xcodegen generate.
packages:
  MobileAccessCore:
    path: ../Packages/MobileAccessCore
targetTemplates:
  iOSDistribution:
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 289GY9L343
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "31"
targets:
  AIQuota-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    templates: [iOSDistribution]
    sources:
      - App
      - Shared
      - SignInSupport
      - ../AIQuota/AppIcon.icon
      - ../AIQuota/Analytics/AnalyticsClient.swift
    preBuildScripts:
      - name: Copy local Firebase configuration
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/iOS/Resources
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        script: |
          config_source="$SRCROOT/iOS/Resources/GoogleService-Info.plist"
          config_destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$config_source" ]; then
            mkdir -p "$(dirname "$config_destination")"
            cp "$config_source" "$config_destination"
          else
            rm -f "$config_destination"
          fi
    dependencies:
      - package: MobileAccessCore
      - package: Firebase
        product: FirebaseAnalyticsCore
      - target: AIQuotaWidget-iOS
      - target: AIQuotaCopySignInCode-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iOS/Shared/Mobile.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.MobileAccessProbe.Widget
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aiquota-probe]
        SignInCodeKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.SignInCode
        CFBundleDisplayName: AI Quota
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AIQuotaWidget-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    templates: [iOSDistribution]
    sources: [Widget, Shared]
    dependencies:
      - package: MobileAccessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.mobilewidget
        CODE_SIGN_ENTITLEMENTS: iOS/Shared/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: AI allowance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.MobileAccessProbe.Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AIQuotaCopySignInCode-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    templates: [iOSDistribution]
    sources: [CopySignInCode, SignInSupport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.copySignInCode
        CODE_SIGN_ENTITLEMENTS: iOS/CopySignInCode/CopySignInCode.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CopySignInCode/Info.plist
      properties:
        CFBundleDisplayName: Copy Codex sign-in code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SignInCodeKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.SignInCode
        NSExtension:
          NSExtensionPointIdentifier: com.apple.services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CopySignInCodeRequestHandler
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
  AIQuota-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    templates: [iOSDistribution]
    sources: [Tests]
    dependencies:
      - target: AIQuota-iOS
      - package: MobileAccessCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AIQuota-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    templates: [iOSDistribution]
    sources: [UITests]
    dependencies:
      - target: AIQuota-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIQuota-iOS
schemes:
  AIQuota-iOS-UI-Tests:
    build:
      targets:
        AIQuota-iOS: all
    test:
      targets: [AIQuota-iOSUITests]
  AIQuota-iOS:
    build:
      targets:
        AIQuota-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets: [AIQuota-iOSTests]
