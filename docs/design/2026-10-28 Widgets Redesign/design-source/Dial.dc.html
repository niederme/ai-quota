<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":124,"min":40,"max":240},"mode":{"editor":"enum","options":["two","one"],"default":"two"},"p1":{"editor":"text","default":"62"},"p2":{"editor":"text","default":"41"},"l1":{"editor":"text","default":"5h"},"l2":{"editor":"text","default":"7d"},"state":{"editor":"enum","options":["auto","stale","off"],"default":"auto"},"tone":{"editor":"enum","options":["dark","light","vibrant","tinted","legacy","legacy-vibrant"],"default":"dark"},"glyph":{"editor":"enum","options":["codex","claude","alert","demo","none"],"default":"codex"},"readings":{"editor":"enum","options":["both","one","none"],"default":"both"},"amount":{"editor":"text","default":""},"sub":{"editor":"text","default":""},"badge":{"editor":"enum","options":["none","clock"],"default":"none"},"rings":{"editor":"enum","options":["on","off"],"default":"on"},"caption":{"editor":"text","default":""},"caption2":{"editor":"text","default":""},"ringtext":{"editor":"text","default":""},"thin":{"editor":"text","default":""},"capStyle":{"editor":"enum","options":["gap","curve"],"default":"gap"},"$preview":{"width":124,"height":124}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const S = Number(P.size ?? 124);
    const tone = P.tone ?? 'dark';
    const mode = P.mode ?? 'two';
    const readings = P.readings ?? 'both';
    const num = (v) => (v === undefined || v === null || v === '' || v === 'na') ? null : Number(v);
    const p1 = num(P.p1 ?? '62');
    const p2 = mode === 'two' ? num(P.p2 ?? '41') : null;
    const worst = Math.max(p1 ?? 0, p2 ?? 0);
    const st = P.state ?? 'auto';
    const vib = { ok: '#ffffff', warn: '#ffffff', crit: '#ffffff', sec: 'rgba(255,255,255,0.55)', track: 'rgba(255,255,255,0.2)' };
    const pals = {
      dark: { ok: '#bf5af2', warn: '#ff9f0a', crit: '#ff453a', sec: 'rgba(235,235,245,0.62)', track: 'rgba(118,118,128,0.30)' },
      light: { ok: '#af52de', warn: '#ff9500', crit: '#ff3b30', sec: 'rgba(60,60,67,0.62)', track: 'rgba(116,116,128,0.16)' },
      vibrant: vib,
      tinted: { ok: '#a9c7ff', warn: '#a9c7ff', crit: '#a9c7ff', sec: 'rgba(255,255,255,0.55)', track: 'rgba(169,199,255,0.25)' },
      legacy: { ok: '#9e38ed', warn: '#ffa600', crit: '#ff3b30', sec: 'rgba(235,235,245,0.62)', track: 'rgba(235,235,245,0.14)' },
      'legacy-vibrant': vib
    };
    const pal = pals[tone] || pals.dark;
    const color = (st === 'stale' || st === 'off') ? pal.sec : worst >= 95 ? pal.crit : worst >= 85 ? pal.warn : pal.ok;

    const C = (r) => 2 * Math.PI * r;
    const dashed = (r) => {
      const arc = 0.75 * C(r); const parts = []; let t = 0;
      while (t + 2 <= arc) { parts.push('2', t + 5 <= arc ? '3' : String((arc - t - 2).toFixed(2))); t += 5; }
      parts.push(String(C(r).toFixed(2)));
      return parts.join(' ');
    };
    const ring = (r, w, p, na) => ({
      r, w,
      trackDash: na ? dashed(r) : (0.75 * C(r)).toFixed(2) + ' ' + C(r).toFixed(2),
      fillDash: p === null ? '0 ' + C(r).toFixed(2) : (0.75 * C(r) * Math.min(100, Math.max(0, p)) / 100).toFixed(2) + ' ' + C(r).toFixed(2)
    });
    const legacyV = tone === 'legacy-vibrant';
    const legacy = tone === 'legacy';
    let o, i;
    if (mode === 'two') {
      if (legacyV) { o = ring(41, 12, p1, p1 === null); i = ring(27.5, 12, p2, p2 === null); }
      else if (legacy) { o = ring(45.5, 9, p1, p1 === null); i = ring(36, 7, p2, p2 === null); }
      else { o = ring(45, 6.5, p1, p1 === null); i = ring(37, 6.5, p2, p2 === null); }
    } else {
      if (legacyV) o = ring(40.5, 13, p1, p1 === null);
      else if (legacy) o = ring(44.5, 11, p1, p1 === null);
      else if (P.thin === '1') o = ring(42.5, 9.7, p1, p1 === null);
      else o = ring(44, 9.7, p1, p1 === null);
      i = { r: 10, w: 0, trackDash: '0 100', fillDash: '0 100' };
    }
    const ringsOff = (P.rings ?? 'on') === 'off';
    if (ringsOff) { o = { ...o, w: 0 }; i = { ...i, w: 0 }; }
    const ring2op = legacy ? 0.5 : (legacyV || tone === 'vibrant') ? 0.6 : 0.7;

    const pct = (p) => p === null ? 'N/A' : Math.round(p) + '%';
    const l1 = P.l1 ?? (mode === 'two' ? '5h' : '31d');
    const l2 = P.l2 ?? '7d';
    const amount = P.amount ?? '';
    let line1, line2;
    if (amount) { line1 = amount; line2 = P.sub ?? ''; }
    else if (readings === 'one') {
      const useSecond = mode === 'two' && p2 !== null && p2 > (p1 ?? 0);
      line1 = useSecond ? pct(p2) : pct(p1); line2 = useSecond ? l2 : l1;
    }
    else if (mode === 'two') { line1 = pct(p1) + ' ' + l1; line2 = pct(p2) + ' ' + l2; }
    else { line1 = pct(p1); line2 = l1; }

    let F1, F2, W1 = 500, W2 = 500, G, gap;
    if (legacy) {
      F1 = S * (mode === 'two' ? 0.175 : 0.15); F2 = S * 0.125; W1 = 700; W2 = 600; G = S * 0.16; gap = S * 0.01;
    } else if (readings === 'one') {
      F1 = S * 0.18; F2 = S * 0.13; W1 = 500; W2 = 500; G = S * 0.19; gap = 0;
    } else if (readings === 'none') {
      F1 = S * 0.12; F2 = S * 0.12; G = legacyV ? S * 0.26 : S * 0.3; gap = 0;
    } else {
      F1 = S * 0.121; F2 = mode === 'two' || amount ? S * 0.121 : S * 0.089; G = S * 0.145; gap = 0;
      if (amount) F2 = S * 0.089;
    }
    const caption = P.caption ?? '';
    const styleProp = P.capStyle ?? P['cap-style'] ?? P.capstyle ?? (P.curve === '1' || P.curve === true ? 'curve' : 'gap');
    const ringText = P.ringtext ?? '';
    const capCurve = readings === 'none' && (!!ringText || ((!!caption || !!P.caption2) && styleProp === 'curve'));
    const capPx = S * 0.115;
    let arcChars = [];
    if (capCurve) {
      let measure = (ch) => capPx * (ch === ' ' ? 0.3 : 0.6);
      try {
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.font = '400 ' + capPx + 'px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif';
        measure = (ch) => ctx.measureText(ch).width;
      } catch (e) {}
      const ls = capPx * 0.08;
      const rc = S * 0.255;
      const chars = Array.from(caption);
      const widths = chars.map(measure);
      const total = widths.reduce((a, b) => a + b, 0) + ls * (chars.length - 1);
      const lay = (text, top, op, rcIn) => {
        const rc = rcIn || S * (mode === 'one' ? 0.28 : 0.25);
        const maxDeg = (caption && P.caption2) ? 120 : 160;
        const cs = Array.from(text);
        const ws0 = cs.map(measure);
        const tot0 = ws0.reduce((a, b) => a + b, 0) + ls * (cs.length - 1);
        const sc = Math.min(1, (maxDeg * Math.PI / 180) * rc / tot0);
        const ws = ws0.map((w) => w * sc);
        const lsS = ls * sc;
        const tot = tot0 * sc;
        const fs = (capPx * sc).toFixed(2);
        const half = (tot / rc) * 90 / Math.PI;
        let c = 0;
        return cs.map((ch, k) => {
          const mid = c + ws[k] / 2;
          c += ws[k] + lsS;
          const step = (mid / rc) * 180 / Math.PI;
          const deg = top ? 270 - half + step : 90 + half - step;
          const rad = deg * Math.PI / 180;
          return { ch, op, fs, x: (S / 2 + rc * Math.cos(rad)).toFixed(2), y: (S / 2 + rc * Math.sin(rad)).toFixed(2), r: (deg - (top ? 270 : 90)).toFixed(2) };
        });
      };
      if (ringText) {
        const unit = S / 100;
        const rPx = o.r * unit;
        const cs = Array.from(ringText);
        const totPx = cs.map(measure).reduce((a, b) => a + b, 0) + ls * (cs.length - 1);
        const Cu = 2 * Math.PI * o.r;
        const gapU = totPx / unit + 6;
        const half = 0.375 * Cu;
        const a = Math.max(0, half - gapU / 2);
        const f = 0.75 * Cu * Math.min(100, Math.max(0, p1 ?? 0)) / 100;
        o = { ...o,
          trackDash: [a, gapU, a, Cu].map((v) => v.toFixed(2)).join(' '),
          fillDash: (f <= a ? [f, Cu] : f <= a + gapU ? [a, Cu] : [a, gapU, f - a - gapU, Cu]).map((v) => v.toFixed(2)).join(' ')
        };
        arcChars = lay(ringText, true, 1, rPx);
      } else {
        arcChars = (caption ? lay(caption, true, 1) : []).concat(P.caption2 ? lay(P.caption2, false, 0.6) : []);
      }
    }
    const capBottom = readings === 'none' && !!caption && !capCurve;
    if (capBottom) { G = S * 0.3; }
    if (capCurve) { G = S * 0.24; }
    if (ringsOff) G = S * 0.8;
    const glyph = P.glyph ?? 'codex';
    const stale = st === 'stale';
    return {
      S, color, track: pal.track, o, i, ring2op,
      dim: (stale && (legacy || legacyV)) ? 0.45 : 1,
      gap: gap.toFixed(1), pt: '0', gMb: (readings === 'both' && !legacy ? S * 0.032 : 0).toFixed(1),
      G: G.toFixed(1), F1: F1.toFixed(1), F2: F2.toFixed(1), W1, W2,
      glyphColor: (tone === 'vibrant' || legacyV) ? '#ffffff' : color,
      gCodex: glyph === 'codex', gClaude: glyph === 'claude', gAlert: glyph === 'alert', gDemo: glyph === 'demo',
      showR1: readings !== 'none', showR2: (readings === 'both' || readings === 'one') && !!line2,
      capBottom, caption, arcChars, capF: (capCurve ? capPx : S * 0.135).toFixed(1), capB: (S * 0.0).toFixed(1),
      line1, line2, op2: (readings === 'one' || caption) ? 0.85 : (mode === 'two' && !amount) ? ring2op : (amount ? 0.75 : 1),
      gPos: readings === 'one' ? 'absolute' : 'static', gBottom: (S * 0.01).toFixed(1),
      numFont: readings === 'one' ? "ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif" : 'inherit',
      clock: (P.badge ?? 'none') === 'clock', B: Math.max(11, S * 0.12).toFixed(1), secColor: pal.sec,
      clockInk: tone === 'light' ? '#f4f1f7' : '#0b060f',
      aria: (glyph === 'claude' ? 'Claude' : glyph === 'codex' ? 'Codex' : 'Service') + ' allowance used: ' + line1 + (line2 ? ', ' + line2 : '')
    };
  }
}
</script>
