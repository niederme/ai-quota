name: AIQuota

include:
  - iOS/project.yml

options:
  bundleIdPrefix: com.niederme
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupOrdering:
    - pattern: AIQuota
      order: [Views, ViewModels, Resources]

# ── Version / Build number ─────────────────────────────────────────────────
# MARKETING_VERSION = user-facing version (1.0, 1.1, 2.0…) — bump manually.
# CURRENT_PROJECT_VERSION = Sparkle / bundle build number — bump for every release.
settings:
  base:
    MARKETING_VERSION: "1.9.28"
    CURRENT_PROJECT_VERSION: "388"

packages:
  AIQuotaKit:
    path: Packages/AIQuotaKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.7.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.9.0

configs:
  Debug: debug
  Release: release
  Demo: debug

schemes:
  AIQuota-macOS:
    build:
      targets:
        AIQuota: all
        AIQuotaWidget: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release

  AIQuota-macOS-TestFlight:
    build:
      targets:
        AIQuotaStore: all
        AIQuotaWidgetStore: all
    run:
      config: Debug
    archive:
      config: Release

  AIQuota-macOS-Demo:
    build:
      targets:
        AIQuota: all
    run:
      config: Demo
    archive:
      config: Demo

targetTemplates:
  StoreDistribution:
    settings:
      base:
        CURRENT_PROJECT_VERSION: "388"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 289GY9L343
        ENABLE_HARDENED_RUNTIME: YES

targets:

  # ── Main App ──────────────────────────────────────────────────────────────

  AIQuota:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: AIQuota
        excludes:
          - Resources/AIQuota.entitlements
          - Resources/AIQuota-TestFlight.entitlements
          - Resources/Info-TestFlight.plist
          - Resources/Analytics.plist
          - Resources/GoogleService-Info.plist
    resources:
      - path: AIQuota/Resources/Assets.xcassets
    dependencies:
      - package: AIQuotaKit
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Sparkle
        product: Sparkle
      - target: AIQuotaWidget
        embed: true
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 289GY9L343
        CODE_SIGN_ENTITLEMENTS: AIQuota/Resources/AIQuota.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_FILE: AIQuota/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Menubar-only app — no Dock icon
        # LSUIElement is set in Info.plist
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule
        Demo:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEMO_MODE
  # ── Widget Extension ──────────────────────────────────────────────────────

  AIQuotaWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: AIQuotaWidget
        excludes:
          - Resources/AIQuotaWidget.entitlements
          - Resources/AIQuotaWidget-TestFlight.entitlements
          - Resources/Info-TestFlight.plist
    dependencies:
      - package: AIQuotaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.widget
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 289GY9L343
        CODE_SIGN_ENTITLEMENTS: AIQuotaWidget/Resources/AIQuotaWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: AIQuotaWidget/Resources/Info.plist

  # Store targets share sources, but never link or embed Sparkle.

  AIQuotaStore:
    productName: AIQuota
    templates: [StoreDistribution]
    type: application
    platform: macOS
    sources:
      - path: AIQuota
        excludes:
          - Resources/*.entitlements
          - Resources/Info.plist
          - Resources/Info-TestFlight.plist
          - Resources/Analytics.plist
          - Resources/GoogleService-Info.plist
          - Support/LaunchServicesSync.swift
    dependencies:
      - package: AIQuotaKit
      - package: Firebase
        product: FirebaseAnalyticsCore
      - target: AIQuotaWidgetStore
        embed: true
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_NAME: AIQuota
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota
        CODE_SIGN_ENTITLEMENTS: AIQuota/Resources/AIQuota-TestFlight.entitlements
        INFOPLIST_FILE: AIQuota/Resources/Info-TestFlight.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  AIQuotaWidgetStore:
    productName: AIQuotaWidget
    templates: [StoreDistribution]
    type: app-extension
    platform: macOS
    sources:
      - path: AIQuotaWidget
        excludes:
          - Resources/*.entitlements
          - Resources/Info.plist
          - Resources/Info-TestFlight.plist
    dependencies:
      - package: AIQuotaKit
    settings:
      base:
        PRODUCT_NAME: AIQuotaWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.widget
        CODE_SIGN_ENTITLEMENTS: AIQuotaWidget/Resources/AIQuotaWidget-TestFlight.entitlements
        INFOPLIST_FILE: AIQuotaWidget/Resources/Info-TestFlight.plist
