name: AIQuota-iOS
options:
  bundleIdPrefix: com.niederme
  deploymentTarget:
    iOS: "17.0"
packages:
  MobileAccessCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 289GY9L343
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "25"
targets:
  AIQuota-iOS:
    type: application
    platform: iOS
    sources: [App, Shared, ../../AIQuota/AppIcon.icon]
    dependencies:
      - package: MobileAccessCore
      - target: CodexLockScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.MobileAccessProbe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Shared/Mobile.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota
    info:
      path: App/Info.plist
      properties:
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.MobileAccessProbe.Widget
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aiquota-probe]
        CFBundleDisplayName: AI Quota
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CodexLockScreen:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: MobileAccessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.MobileAccessProbe.Widget
        CODE_SIGN_ENTITLEMENTS: Shared/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.niederme.AIQuota.mobilewidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: AI allowance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WidgetKeychainGroup: $(AppIdentifierPrefix)com.niederme.AIQuota.MobileAccessProbe.Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MobileAccessHostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AIQuota-iOS
      - package: MobileAccessCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIQuota-iOS:
    build:
      targets:
        AIQuota-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets: [MobileAccessHostTests]
